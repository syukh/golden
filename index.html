<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden</title>
  <!-- 1. Підключити шрифти та Tailwindcss -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Dynalight&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <!-- 2. Section Home -->
  <section class="relative w-full min-h-screen bg-[url(./img/bg.png)] bg-cover inset-0">
    <div class="absolute w-full h-full inset-0 bg-black/40 flex flex-col pt-14">
      <!-- Навігація -->
      <header class="container mx-auto flex justify-between items-center">
        <div class="text-[#FED136] font-[Dynalight] md:text-5xl">Golden</div>
        <nuv class="text-white font-[Prompt] font-extralight flex gap-14 uppercase tracking-wider">
          <a href="#" class="font-semibold hover:text-[#FED136] transition">Home</a>
          <a href="#" class="hover:text-[#FED136] transition">Services</a>
          <a href="#" class="hover:text-[#FED136] transition">Portfolio</a>
          <a href="#" class="hover:text-[#FED136] transition">About</a>
          <a href="#" class="hover:text-[#FED136] transition">Contact</a>
        </nuv>
      </header>
      <!-- Зоголовок сайту -->
      <div class="flex flex-grow flex-col justify-center items-center  text-white">
        <p class="text-5xl font-[Inter] mb-4">Welcome To Our Studio!</p>
        <p class="text-8xl uppercase font-[Prompt] font-semibold mb-20">It’s nice to Meet you</p>
        <button type="button" class="uppercase text-4xl font-bold bg-[#FED136] rounded-xl px-12 py-6">Tell Me
          More</button>
      </div>
    </div>
  </section>
</body>

</html>
